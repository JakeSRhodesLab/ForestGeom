[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forestgeom"
version = "0.0.6"
description = "Sparse geometry and proximity tools for tree ensemble models"
readme = "README.md"
requires-python = ">=3.10, <3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
keywords = [
    "decision-forest",
    "forest-proximity",
    "leaf-incidence-kernel",
    "kernel-methods",
    "sparse-features",
    "machine-learning",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Adrien Aumon", email = "adrien.aumon@umontreal.ca" },
	{ name = "Jake Rhodes", email = "jakerhodes8@gmail.com" },
]
dependencies = [
	"numpy>=1.23",
	"scipy>=1.9",
	"scikit-learn>=1.3,<2",
]

[project.urls]
Homepage = "https://github.com/JakeSRhodesLab/ForestGeom"
Repository = "https://github.com/JakeSRhodesLab/ForestGeom"
Issues = "https://github.com/JakeSRhodesLab/ForestGeom/issues"

[project.optional-dependencies]
boosted = ["lightgbm>=4.3", "xgboost>=2.0"]
viz = ["matplotlib", "seaborn", "umap-learn", "phate"]
experiments = ["pandas", "pyarrow", "matplotlib", "seaborn", "umap-learn", "phate"]
test = ["pytest", "pytest-cov"]
all = ["lightgbm>=4.3","xgboost>=2.0","matplotlib","seaborn","umap-learn","phate","pandas","pyarrow","pytest","pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/forestgeom"]

[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]
