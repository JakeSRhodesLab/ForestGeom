name: Publish Python 🐍 distributions to PyPI 📦

on:
  push:
    tags:
      - "v*"
      - "test-v*"

jobs:
  build-publish-release:
    name: Build, publish, and create GitHub release
    runs-on: ubuntu-latest

    environment:
      name: ${{ startsWith(github.ref_name, 'test-v') && 'testpypi' || 'pypi' }}

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify tag matches package version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/forestgeom/version.py)
          TAG="${GITHUB_REF_NAME}"

          if [ -z "${VERSION}" ]; then
            echo "Could not read __version__ from src/forestgeom/version.py."
            exit 1
          fi

          if [[ "${TAG}" == test-v* ]]; then
            EXPECTED_TAG="test-v${VERSION}"
          else
            EXPECTED_TAG="v${VERSION}"
          fi

          if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${TAG} does not match package version ${VERSION}."
            echo "Expected tag: ${EXPECTED_TAG}"
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Publish to TestPyPI
        if: startsWith(github.ref_name, 'test-v')
        run: uv publish --publish-url https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: startsWith(github.ref_name, 'v')
        run: uv publish

      - name: Create GitHub prerelease
        if: startsWith(github.ref_name, 'test-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Create GitHub release
        if: startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz
